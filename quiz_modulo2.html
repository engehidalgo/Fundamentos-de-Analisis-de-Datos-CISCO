<script>
const BAR_H = [18,28,38,48,38,48,38,28,18];
function drawBars(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '';
  BAR_H.forEach(function(h) {
    const b = document.createElement('div');
    b.className = 'cisco-bar';
    b.style.height = h + 'px';
    el.appendChild(b);
  });
}
drawBars('logo-bars');
const L = ['A','B','C','D'];
const Q = [
  { s:'2.1 · Datos y Conjuntos de Datos', q:'¿Cómo se denomina una recopilación de datos?', o:['Metadatos','Conjunto de datos','Archivo CSV','Base de datos'], c:1, f:'Una recopilación de datos se denomina conjunto de datos. Puede existir para uso privado de una organización o compartirse públicamente en Internet.' },
  { s:'2.1 · Datos y Conjuntos de Datos', q:'¿Qué son los metadatos en el contexto de un conjunto de datos?', o:['Los datos numéricos del conjunto','La información sobre el conjunto de datos: qué contiene y cómo está formateado','El archivo principal de análisis','Los datos históricos del conjunto'], c:1, f:'Los metadatos son información sobre el conjunto de datos, incluyendo descripción de lo que contiene y cómo está formateado. Son herramientas valiosas para que los analistas comprendan los datos.' },
  { s:'2.1 · Datos y Conjuntos de Datos', q:'¿Cuál es uno de los formatos más comunes para empaquetar e intercambiar datos?', o:['PDF','DOCX','CSV — valores separados por comas','ZIP'], c:2, f:'El formato CSV es uno de los más comunes para empaquetar e intercambiar datos. Los conjuntos de datos públicos suelen estar compuestos por varios archivos CSV relacionados.' },
  { s:'2.1 · Datos y Conjuntos de Datos', q:'¿Cuál es un ejemplo de conjunto de datos privado?', o:['Repositorio de datos de la OMS','Conjunto de datos de películas en Kaggle','Datos de pacientes de un médico','Dataset de GitHub público'], c:2, f:'El conjunto de datos de pacientes de un médico es privado — el acceso está limitado a quienes tienen permiso. Opuesto al repositorio de la OMS, que es público.' },
  { s:'2.1.3 · Herramientas de Análisis', q:'¿Qué significa la sigla SQL?', o:['Simple Query Language','Structured Query Language — Lenguaje de Consulta Estructurado','Standard Query Logic','System Query Language'], c:1, f:'SQL significa Structured Query Language (Lenguaje de Consulta Estructurado). Es una potente herramienta de administración de bases de datos relacionales.' },
  { s:'2.1.3 · Herramientas de Análisis', q:'¿Cuál es la principal ventaja de SQL sobre Excel para análisis de datos?', o:['Es más fácil de aprender','Tiene mejores gráficos','Es más rápido y puede manejar conjuntos de datos mucho más grandes','Funciona sin conexión a internet'], c:2, f:'SQL es más rápido y puede manejar conjuntos de datos mucho más grandes que Excel. Se utiliza para acceder, leer, manipular y analizar datos en bases de datos relacionales.' },
  { s:'2.1.3 · Herramientas de Análisis', q:'¿Para qué sirve principalmente Tableau?', o:['Para escribir consultas SQL','Para análisis y visualización — crear dashboards comprensibles para tomadores de decisiones no técnicos','Para almacenar grandes volúmenes de datos','Para hacer web scraping'], c:1, f:'Tableau es una de las herramientas de análisis y visualización más utilizadas. Permite presentar datos en formatos que los responsables no técnicos pueden comprender fácilmente.' },
  { s:'2.1.3 · Herramientas de Análisis', q:'¿Qué es Kaggle?', o:['Un lenguaje de programación para análisis','Una herramienta de hojas de cálculo de Google','Una comunidad en línea para científicos de datos y entusiastas del aprendizaje automático','Un sistema de gestión de bases de datos relacionales'], c:2, f:'Kaggle es una comunidad en línea para científicos de datos y entusiastas del ML para compartir ideas, inspirarse y competir para resolver desafíos de ciencia de datos.' },
  { s:'2.1.3 · Herramientas de Análisis', q:'¿Cuáles dos afirmaciones describen correctamente a Kaggle?', o:['Proporciona datasets con cargos mínimos','Es una comunidad en línea para compartir ideas Y ofrece concursos de aprendizaje automático','Permite la integración directa de Excel, SQL y Tableau','Es una plataforma exclusiva para empresas Fortune 500'], c:1, f:'Kaggle es una comunidad en línea para compartir ideas y ofrece concursos comunitarios de aprendizaje automático entre entusiastas. Los datasets son gratuitos.' },
  { s:'2.3 · Variables y Observaciones', q:'¿Qué es una variable en el contexto del análisis de datos?', o:['Un error en el conjunto de datos','Cualquier cosa que varía de una instancia a otra y se puede medir','Un tipo de gráfico en Excel','Una columna fija en una base de datos'], c:1, f:'Una variable es cualquier cosa que varía de una instancia a otra, que se puede medir y cuyo valor se puede manipular. Son las características clave que se estudiarán en el análisis.' },
  { s:'2.3 · Variables y Observaciones', q:'¿Cómo se representa cada observación en una hoja de cálculo de Excel?', o:['Como una columna','Como una fórmula','Como una fila','Como una hoja separada'], c:2, f:'Cada observación se representa como un registro en una base de datos o una fila en Excel. La colección de observaciones constituye el conjunto de datos.' },
  { s:'2.3 · Variables y Observaciones', q:'¿Cuáles son los dos grandes tipos de variables en análisis de datos?', o:['Positivas y negativas','Simples y complejas','Categóricas y numéricas','Discretas y continuas'], c:2, f:'Todas las variables se clasifican en categóricas (valor cualitativo, indican membresía a un grupo) y numéricas (valores cuantitativos).' },
  { s:'2.3 · Variables y Observaciones', q:'¿Cuál de estos es un ejemplo de variable nominal?', o:['Rango de clases (1ro, 2do, 3ro)','Color de ojos','Temperatura','Número de automóviles en un estacionamiento'], c:1, f:'El color de ojos es nominal — categorías discretas cuyo valor depende de la identidad del objeto, sin que el orden entre categorías importe.' },
  { s:'2.3 · Variables y Observaciones', q:'¿Cuál de estos es un ejemplo de variable ordinal?', o:['Sexo','Tipo de animal','Escala de satisfacción: insatisfecho, neutro, satisfecho','Peso en kilogramos'], c:2, f:'La escala de satisfacción es ordinal — compuesta por categorías donde el orden entre ellas es importante. El rango de clases de estudiantes (1ro, 2do, 3ro) es otro ejemplo.' },
  { s:'2.3 · Variables y Observaciones', q:'¿Cuál de estos es un ejemplo de variable discreta?', o:['Temperatura','Ingresos de ventas','Presión arterial','Cantidad de usuarios en una red'], c:3, f:'La cantidad de usuarios es discreta — cuantitativa con un conjunto finito de valores específicos. No puede haber 2,5 usuarios, por ejemplo.' },
  { s:'2.3 · Variables y Observaciones', q:'¿Cuál de estos es un ejemplo de variable continua?', o:['Número de sensores habilitados','Cantidad de automóviles en un estacionamiento','Temperatura corporal','Rango de clases de estudiantes'], c:2, f:'La temperatura corporal es continua — puede medirse a lo largo de un rango de valores y puede tomar cualquier valor dentro de ese rango, incluyendo decimales.' },
  { s:'2.3 · Variables y Observaciones', q:'¿Por qué es importante conocer el tipo de variable en un dataset?', o:['Para saber cuánto espacio ocupa en disco','Porque algunos tipos de análisis y visualizaciones están diseñados para ciertos tipos de datos','Para determinar si el dataset es público o privado','Para calcular el número de filas necesarias'], c:1, f:'El tipo de variable determina qué análisis aplicar y qué gráfico usar: barras para nominales, dispersión para continuas. Elegir la visualización incorrecta puede llevar a conclusiones erróneas.' },
  { s:'2.3 · Variables y Observaciones', q:'En el análisis de datos, ¿qué es un punto de datos?', o:['El total de todas las observaciones del dataset','El valor o conjunto de valores de una observación específica','El nombre de una variable en el conjunto de datos','Un error detectado durante la limpieza de datos'], c:1, f:'El valor o conjunto de valores de una observación específica se denomina punto de datos. Cada observación puede representarse como una fila en una hoja de cálculo de Excel.' },
  { s:'2.3 · Variables y Observaciones', q:'¿Cuál es la diferencia entre una variable de intervalo y una de relación?', o:['No hay diferencia, son lo mismo','En la variable de relación, el cero significa ausencia total de esa variable; en la de intervalo no','La variable de intervalo siempre es discreta','La variable de relación siempre es categórica'], c:1, f:'En las variables de relación, el cero significa que no hay nada de esa variable — ej: ingresos $0 = sin ingresos. En las de intervalo, el cero no implica ausencia total — ej: 0°C no significa sin temperatura.' },
  { s:'2.1 · Datos y Conjuntos de Datos', q:'¿Cuál de estas es una técnica avanzada para crear tu propio conjunto de datos cuando no encontrás uno disponible?', o:['Descargar datos de Kaggle','Web scraping o uso de APIs','Copiar datos de Wikipedia manualmente','Solicitar datos a Google'], c:1, f:'El web scraping y el uso de APIs son técnicas avanzadas para crear datasets propios extrayendo datos de sitios web. En este curso solo se usan datos existentes disponibles públicamente.' }
,

  // Árbol de clasificación de variables
  { s:'2.3 · Clasificación de Variables', q:'¿Cuáles son los dos grandes grupos en los que se clasifican todas las variables?', o:['Continuas y discretas','Nominales y ordinales','Categóricas y numéricas','Simples y compuestas'], c:2, f:'Toda variable pertenece a uno de dos grandes grupos: categórica (valor cualitativo, indica membresía a un grupo) o numérica (valor cuantitativo, medible). Todos los demás tipos son subtipos de estos dos.' },
  { s:'2.3 · Clasificación de Variables', q:'¿Cuáles son los dos subtipos de las variables categóricas?', o:['Continua y discreta','Nominal y ordinal','De intervalo y de relación','Positiva y negativa'], c:1, f:'Las variables categóricas se dividen en: nominal (categorías sin orden entre sí, como color de ojos) y ordinal (categorías donde el orden importa, como nivel de satisfacción).' },
  { s:'2.3 · Clasificación de Variables', q:'¿Cuáles son los dos subtipos de las variables numéricas?', o:['Nominal y ordinal','De intervalo y de relación','Continua y discreta','Positiva y negativa'], c:2, f:'Las variables numéricas se dividen en: continua (rango infinito de valores, puede tener decimales) y discreta (conjunto finito de valores enteros específicos).' },
  { s:'2.3 · Clasificación de Variables', q:'¿Cuáles son los dos subtipos de las variables continuas?', o:['Nominal y ordinal','Positiva y negativa','De intervalo y de relación','Categórica y numérica'], c:2, f:'Las variables continuas se subdividen en: de intervalo (el cero no significa ausencia total, ej: temperatura) y de relación (el cero sí significa ausencia total, ej: ingresos, volumen de ventas).' },
  { s:'2.3 · Clasificación de Variables', q:'¿Cuál es el árbol correcto de clasificación de la variable "temperatura corporal"?', o:['Variable → Categórica → Ordinal','Variable → Numérica → Discreta','Variable → Numérica → Continua → De intervalo','Variable → Numérica → Continua → De relación'], c:2, f:'La temperatura es: Numérica (valor cuantitativo) → Continua (puede tener decimales, rango infinito) → De intervalo (0°C no significa ausencia de temperatura, solo un punto en la escala).' },
  { s:'2.3 · Clasificación de Variables', q:'¿Cuál es el árbol correcto de clasificación de la variable "ingresos mensuales"?', o:['Variable → Categórica → Nominal','Variable → Numérica → Discreta','Variable → Numérica → Continua → De intervalo','Variable → Numérica → Continua → De relación'], c:3, f:'Los ingresos son: Numérica → Continua → De relación. Son de relación porque $0 ingresos sí significa ausencia total de ingresos — el cero tiene significado absoluto.' },
  { s:'2.3 · Clasificación de Variables', q:'¿Cuál es el árbol correcto de clasificación de la variable "nivel educativo" (primaria, secundaria, universitaria)?', o:['Variable → Categórica → Nominal','Variable → Categórica → Ordinal','Variable → Numérica → Discreta','Variable → Numérica → Continua'], c:1, f:'El nivel educativo es: Categórica (no es un número, indica membresía a un grupo) → Ordinal (el orden importa: primaria < secundaria < universitaria). No es nominal porque hay jerarquía.' },
  { s:'2.3 · Clasificación de Variables', q:'¿Cuál es el árbol correcto de clasificación de la variable "tipo de animal" (perro, gato, ave)?', o:['Variable → Categórica → Nominal','Variable → Categórica → Ordinal','Variable → Numérica → Discreta','Variable → Numérica → Continua'], c:0, f:'El tipo de animal es: Categórica (indica membresía a un grupo) → Nominal (no hay orden entre perro, gato y ave — ninguno es "mayor" que otro). Es solo una etiqueta de identidad.' },
  { s:'2.3 · Clasificación de Variables', q:'¿Cuál es el árbol correcto de clasificación de la variable "número de sensores activos en una red"?', o:['Variable → Categórica → Nominal','Variable → Categórica → Ordinal','Variable → Numérica → Continua → De relación','Variable → Numérica → Discreta'], c:3, f:'El número de sensores es: Numérica (valor cuantitativo) → Discreta (solo puede tomar valores enteros específicos: 0, 1, 2, 3... No puede haber 2,5 sensores activos).' },
  // Casos prácticos
  { s:'2.3 · Casos Prácticos de Variables', q:'Un hospital registra el "grupo sanguíneo" de sus pacientes (A, B, AB, O). ¿Cómo se clasifica esta variable?', o:['Numérica → Continua','Numérica → Discreta','Categórica → Nominal','Categórica → Ordinal'], c:2, f:'El grupo sanguíneo es Categórica → Nominal: indica membresía a un grupo (A, B, AB, O) sin que haya un orden natural entre los grupos. Ningún grupo sanguíneo es "mayor" que otro.' },
  { s:'2.3 · Casos Prácticos de Variables', q:'Una encuesta mide la satisfacción del cliente con opciones: "Muy insatisfecho, Insatisfecho, Neutro, Satisfecho, Muy satisfecho". ¿Cómo se clasifica?', o:['Numérica → Continua','Numérica → Discreta','Categórica → Nominal','Categórica → Ordinal'], c:3, f:'Es Categórica → Ordinal: las categorías indican membresía a un grupo (categórica) Y tienen un orden claro entre sí (ordinal) — "Muy satisfecho" es claramente mayor que "Insatisfecho".' },
  { s:'2.3 · Casos Prácticos de Variables', q:'Un e-commerce registra el "volumen de ventas en unidades" por día. ¿Cómo se clasifica esta variable?', o:['Categórica → Nominal','Categórica → Ordinal','Numérica → Continua → De relación','Numérica → Discreta'], c:3, f:'El volumen de ventas en unidades es Numérica → Discreta: es un valor cuantitativo entero (no puede vender 2,5 unidades). Si fuera en dinero (ingresos), sería Numérica → Continua → De relación.' },
  { s:'2.3 · Casos Prácticos de Variables', q:'Un sensor meteorológico registra la "presión atmosférica" en milibares. ¿Cómo se clasifica?', o:['Categórica → Nominal','Numérica → Discreta','Numérica → Continua → De relación','Numérica → Continua → De intervalo'], c:3, f:'La presión atmosférica es Numérica → Continua → De intervalo: puede tomar cualquier valor decimal y el cero no significa ausencia de presión (0 milibares es un punto en la escala, no "sin presión").' },
  { s:'2.3 · Casos Prácticos de Variables', q:'Una plataforma registra el "país de origen" de cada usuario. ¿Cómo se clasifica esta variable?', o:['Numérica → Discreta','Categórica → Ordinal','Categórica → Nominal','Numérica → Continua'], c:2, f:'El país de origen es Categórica → Nominal: indica membresía a un grupo (Brasil, Argentina, Colombia...) sin ningún orden natural entre los países. Es una etiqueta de identidad.' },
  { s:'2.3 · Casos Prácticos de Variables', q:'¿Cuál es la diferencia clave entre una variable de intervalo y una de relación?', o:['La de intervalo es discreta; la de relación es continua','En la de relación, el cero significa ausencia total de esa variable; en la de intervalo no','La de intervalo es categórica; la de relación es numérica','No hay diferencia práctica entre ambas'], c:1, f:'La diferencia clave está en el significado del cero: en variables de relación, 0 significa ausencia total (ej: $0 ingresos = sin ingresos). En variables de intervalo, 0 es solo un punto en la escala (ej: 0°C no significa sin temperatura).' }

];
let cur = 0, score = 0, answered = false;
const ss = {};
Q.forEach(function(q) { if (!ss[q.s]) ss[q.s] = {c:0,t:0}; ss[q.s].t++; });
function render() {
  const q = Q[cur];
  document.getElementById('spill').textContent = q.s;
  document.getElementById('qtext').textContent = q.q;
  document.getElementById('qcnt').textContent = 'Pregunta ' + (cur+1) + ' de ' + Q.length;
  document.getElementById('slive').textContent = score + ' correcta' + (score!==1?'s':'');
  document.getElementById('pbar').style.width = ((cur/Q.length)*100) + '%';
  const oe = document.getElementById('opts');
  oe.innerHTML = '';
  q.o.forEach(function(txt, i) {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="ob">' + L[i] + '</span><span>' + txt + '</span>';
    btn.onclick = function() { sel(i); };
    oe.appendChild(btn);
  });
  const fb = document.getElementById('fb');
  fb.className = 'fb'; fb.textContent = '';
  document.getElementById('btn').style.display = 'none';
  answered = false;
}
function sel(idx) {
  if (answered) return;
  answered = true;
  const q = Q[cur];
  const btns = document.querySelectorAll('.opt');
  btns.forEach(function(b) { b.disabled = true; });
  const fb = document.getElementById('fb');
  if (idx === q.c) {
    btns[idx].classList.add('correct');
    fb.className = 'fb fbok show';
    fb.textContent = '✓ Correcto — ' + q.f;
    score++; ss[q.s].c++;
  } else {
    btns[idx].classList.add('wrong');
    btns[q.c].classList.add('reveal');
    fb.className = 'fb fberr show';
    fb.textContent = '✗ Incorrecto — ' + q.f;
  }
  document.getElementById('slive').textContent = score + ' correcta' + (score!==1?'s':'');
  const btn = document.getElementById('btn');
  btn.style.display = 'block';
  btn.textContent = cur < Q.length-1 ? 'Siguiente →' : 'Ver resultados →';
}
function next() { cur++; if (cur >= Q.length) { showResult(); return; } render(); }
function showResult() {
  document.getElementById('qb').style.display = 'none';
  document.querySelector('.pw').style.display = 'none';
  const total = Q.length;
  const pct = Math.round((score/total)*100);
  document.getElementById('rnum').textContent = score;
  document.getElementById('rden').textContent = 'de ' + total + ' preguntas';
  document.getElementById('rpct').textContent = pct + '% de respuestas correctas';
  document.getElementById('rok').textContent = score + ' correctas';
  document.getElementById('rerr').textContent = (total-score) + ' incorrectas';
  document.getElementById('rpctc').textContent = pct + '%';
  const bd = document.getElementById('bdown');
  let html = '<div class="bdtit">Resultados por sección</div>';
  Object.keys(ss).forEach(function(sec) {
    const d = ss[sec];
    const sp = Math.round((d.c/d.t)*100);
    html += '<div class="bdrow"><div class="bdn">' + sec + '</div><div class="bdm"><div class="mbg"><div class="mf" style="width:' + sp + '%"></div></div><span class="bds">' + d.c + '/' + d.t + '</span></div></div>';
  });
  bd.innerHTML = html;
  let msg = '';
  if (pct===100) msg = '¡Perfecto! Dominás completamente todos los conceptos del Módulo 2.';
  else if (pct>=85) msg = '¡Excelente! Tenés una comprensión muy sólida. Revisá las secciones donde fallaste.';
  else if (pct>=70) msg = 'Buen trabajo. Prestá atención especialmente a los tipos de variables.';
  else if (pct>=50) msg = 'Vas bien. Repasá el material, especialmente variables categóricas vs. numéricas.';
  else msg = 'Tomáte un tiempo para releer el material del Módulo 2 antes de continuar.';
  document.getElementById('rmsg').textContent = msg;
  document.getElementById('res').style.display = 'block';
  drawBars('logo-bars-2');
}
function restart() {
  cur = 0; score = 0; answered = false;
  Object.keys(ss).forEach(function(k) { ss[k].c = 0; });
  document.getElementById('res').style.display = 'none';
  document.getElementById('qb').style.display = 'block';
  document.querySelector('.pw').style.display = 'block';
  render();
}
render();
</script>
</body>
</html>
